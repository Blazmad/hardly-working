name: HardlyWorking
options:
  bundleIdPrefix: com.madzar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Declared once at project level so both the app target and the test host
    # read the same name. $(PRODUCT_NAME) cannot be used for the test host: it
    # resolves per target, and in the test target it means HardlyWorkingTests.
    APP_PRODUCT_NAME: Hardly Working
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: 272BX4J7SG
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targets:
  HardlyWorking:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madzar.hardlyworking
        PRODUCT_NAME: $(APP_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: HardlyWorking
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Notarization requires the hardened runtime; setting it here keeps a
        # plain `xcodebuild -configuration Release` aligned with what
        # scripts/build-dmg.sh enforces at codesign time (--options runtime).
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  HardlyWorkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: HardlyWorking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(APP_PRODUCT_NAME).app/Contents/MacOS/$(APP_PRODUCT_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HardlyWorking:
    build:
      targets:
        HardlyWorking: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HardlyWorkingTests
