<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hardly Working">
  <!-- SIMPLIFIED variant of icon.svg, for tiny sizes (a browser tab is 16 logical
       pixels, 32 on a Retina display).

       Why a variant rather than the app icon: rendered at 16 px, the full icon
       becomes unreadable. Measured by rendering both through qlmanage: the steam
       (a 26/1024 stroke, about 0.4 px at that size) turns into a grey smudge, the
       saucer merges with the bottom of the cup, and the whole thing stops reading
       as a cup.

       Three deliberate departures from the app icon:
       - no steam    : invisible below 48 px, contributes nothing but noise
       - no saucer   : merges with the cup, and the handle alone says "cup"
       - larger cup  : it fills half the canvas instead of a third

       Same palette as the icon and the page, so it stays the same logo. -->

  <defs>
    <linearGradient id="hw-ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F0A857"/>
      <stop offset="0.55" stop-color="#D8792E"/>
      <stop offset="1" stop-color="#B4541A"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#hw-ground)"/>

  <!-- Handle first: it sits BEHIND the cup body. -->
  <path d="M 716 396 A 124 124 0 1 1 716 644" fill="none" stroke="#FFFCF7" stroke-width="80" stroke-linecap="round"/>

  <!-- Cup body -->
  <path d="M 216 300 L 728 300 L 688 664 C 679 730 634 768 576 768 L 368 768 C 310 768 265 730 256 664 Z" fill="#FFFCF7"/>

  <!-- Coffee: this dark contrast carries all the legibility at small sizes. -->
  <ellipse cx="472" cy="300" rx="256" ry="50" fill="#FFFCF7"/>
  <ellipse cx="472" cy="302" rx="200" ry="34" fill="#6B3410"/>
</svg>
